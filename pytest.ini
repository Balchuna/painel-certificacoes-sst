[pytest]
testpaths = tests
markers =
    excel: monta o pacote do Power BI dentro do Excel (Windows com Excel e pywin32; leva minutos)
    powerbi: lê o projeto do Power BI com a biblioteca do Power BI Desktop (Windows com o Power BI instalado)
    desktop: abre o projeto do Power BI no Power BI Desktop, atualiza e confere com o gabarito (só com --desktop)
