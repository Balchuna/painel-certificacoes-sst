name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sem Excel e sem Power BI Desktop nas máquinas do GitHub, os testes que precisam deles
# são pulados; -rs mostra no log quais foram e por quê.
jobs:
  test:
    name: Python ${{ matrix.python }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rs
